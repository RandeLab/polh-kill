; polh-kill — mousetrap snap detector
; Hardware: ESP32-S3-WROOM-1 N16R8 DevKitC-1 clone + MPU-92.65 (MPU-6500/9250) on I2C.
;
;   pio run                      build the default env (polh = real sensor)
;   pio run -t upload            flash firmware over USB
;   pio run -t uploadfs          flash the web UI (data/ -> LittleFS)
;   pio run -e polh-ota -t upload        flash firmware over WiFi (ArduinoOTA)
;   pio run -e polh-ota -t uploadfs      flash the web UI over WiFi
;   pio device monitor           serial log (shows IP / hotspot state)
;
; Local overrides (e.g. workspace_dir outside a synced folder, OTA password)
; go into a gitignored file named platformio_local.ini, for example:
;   [platformio]
;   workspace_dir = ${sysenv.USERPROFILE}/.pio-ws/polh-kill
;   [env:polh-ota]
;   upload_flags = --auth=your-admin-password

[platformio]
default_envs = polh
extra_configs = platformio_local*.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0   ; Serial = UART0 on the CH343 "COM" USB-C port
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    ESP32Async/ESPAsyncWebServer@^3.7.0
    ESP32Async/AsyncTCP@^3.4.0
    bblanchon/ArduinoJson@^7.2.0

; Real hardware: MPU-6500/9250 accelerometer over I2C (SDA 8, SCL 9, INT 7).
[env:polh]
build_flags =
    ${env.build_flags}
    -D POLH_SENSOR_MPU6500=1

[env:polh-ota]
extends = env:polh
upload_protocol = espota
upload_port = polh-kill.local

; Simulated accelerometer: runs on any ESP32-S3 without a sensor.
; The web UI gets "inject snap / bump / ..." buttons to test the learning loop.
[env:sim]
build_flags =
    ${env.build_flags}
    -D POLH_SIM_SENSOR=1
